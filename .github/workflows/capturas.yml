# Genera las capturas de pantalla del libro en el simulador.
#
# Es lo que sustituye a tener una Mac delante: la app se compila, se instala en
# un simulador de verdad y se fotografia en varias condiciones. Las imagenes se
# publican como artefacto y de ahi se descargan para el libro.
#
# Todas las pantallas salen de la MISMA ejecucion a proposito: arrancar el
# simulador y compilar es lo caro (unos seis minutos), y cada captura extra
# cuesta seis segundos. Agrupar es lo que hace que esto sea practico.
#
# Que pantalla se abre lo decide el argumento `-demo`, que iOS convierte en una
# clave de UserDefaults. Los valores validos son los del enum `Demo`.

name: Capturas

on:
  workflow_dispatch:

jobs:
  capturar:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Elegir simulador
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries
                     | map(select(.key | test("SimRuntime.iOS")))
                     | sort_by(.key) | last
                     | .value[] | select(.name == "iPhone 17") | .udid')
          if [ -z "$UDID" ]; then echo "No hay iPhone 17"; exit 1; fi
          echo "SIMULADOR=$UDID" >> "$GITHUB_ENV"

      - name: Generar y compilar
        working-directory: PatitasiOS
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          set -o pipefail
          xcodebuild build \
            -project PatitasiOS.xcodeproj -scheme PatitasiOS \
            -destination "id=$SIMULADOR" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Arrancar e instalar
        working-directory: PatitasiOS
        run: |
          xcrun simctl bootstatus "$SIMULADOR" -b
          APP=$(find build/Build/Products -name "PatitasiOS.app" -maxdepth 3 | head -1)
          xcrun simctl install "$SIMULADOR" "$APP"
          mkdir -p capturas

      # La barra de estado real trae la hora del runner y la bateria a medias.
      # Fijarla es lo que hace que dos capturas se puedan comparar, y es lo que
      # Apple exige para las imagenes de la ficha del App Store.
      - name: Fijar la barra de estado
        run: |
          xcrun simctl status_bar "$SIMULADOR" override \
            --time "9:41" \
            --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 \
            --wifiMode active --wifiBars 3

      # ------------------------------------------- Las cuatro condiciones

      - name: Condiciones de la Parte VIII
        working-directory: PatitasiOS
        run: |
          set -eu
          APP=mx.gabrielblanchet.patitas

          # Dispara y COMPRUEBA. Una captura tomada mientras todavia se ve la
          # pantalla de arranque sale en blanco y no falla: hay que detectarla.
          # El criterio es el tamano del PNG. Medido en este mismo runner: una
          # pantalla en blanco pesa 65-76 KB y cualquier pantalla con contenido
          # pasa de 110 KB. El umbral de 95 KB los separa con holgura.
          disparar() {   # $1 archivo, resto: argumentos de lanzamiento
            local salida="$1"; shift
            local intento=1
            while [ $intento -le 4 ]; do
              xcrun simctl launch "$SIMULADOR" "$APP" "$@" >/dev/null
              sleep $((4 + intento * 3))
              xcrun simctl io "$SIMULADOR" screenshot "capturas/$salida" >/dev/null 2>&1
              xcrun simctl terminate "$SIMULADOR" "$APP" >/dev/null 2>&1 || true
              local peso
              peso=$(stat -f%z "capturas/$salida" 2>/dev/null || echo 0)
              if [ "$peso" -gt 95000 ]; then
                echo "$salida: $peso bytes (intento $intento)"
                return 0
              fi
              echo "$salida: $peso bytes, parece la pantalla de arranque; reintento"
              intento=$((intento + 1))
            done
            echo "ERROR: $salida sigue saliendo en blanco tras 4 intentos"
            return 1
          }

          xcrun simctl ui "$SIMULADOR" appearance light
          disparar 01-claro.png
          xcrun simctl ui "$SIMULADOR" appearance dark
          disparar 02-oscuro.png
          xcrun simctl ui "$SIMULADOR" appearance light
          xcrun simctl ui "$SIMULADOR" content_size accessibility-extra-extra-extra-large
          disparar 03-texto-gigante.png
          xcrun simctl ui "$SIMULADOR" content_size medium
          disparar 04-ingles.png -AppleLanguages "(en)" -AppleLocale "en_US"

      # ----------------------------------------- Las pantallas de SwiftUI

      - name: Pantallas de la Parte IX
        working-directory: PatitasiOS
        run: |
          set -eu
          APP=mx.gabrielblanchet.patitas

          # Mismo criterio que en el paso anterior: se comprueba y se reintenta.
          demo() {   # $1 archivo, $2 valor de -demo, resto: extras
            local salida="$1"; local cual="$2"; shift 2
            local intento=1
            while [ $intento -le 4 ]; do
              xcrun simctl launch "$SIMULADOR" "$APP" -demo "$cual" "$@" >/dev/null
              sleep $((4 + intento * 3))
              xcrun simctl io "$SIMULADOR" screenshot "capturas/$salida" >/dev/null 2>&1
              xcrun simctl terminate "$SIMULADOR" "$APP" >/dev/null 2>&1 || true
              local peso
              peso=$(stat -f%z "capturas/$salida" 2>/dev/null || echo 0)
              if [ "$peso" -gt 95000 ]; then
                echo "$salida: $peso bytes (intento $intento)"
                return 0
              fi
              echo "$salida: $peso bytes, parece la pantalla de arranque; reintento"
              intento=$((intento + 1))
            done
            echo "ERROR: $salida sigue saliendo en blanco tras 4 intentos"
            return 1
          }

          demo 10-layout.png            layout
          demo 11-estado.png            estado
          demo 12-listas.png            listas
          demo 13-formulario.png        formulario
          demo 14-animacion-antes.png   animacionAntes
          demo 15-animacion-despues.png animacionDespues
          demo 16-sistema.png           sistema
          demo 17-rendimiento.png       rendimiento

          demo 20-uikit.png             uikit
          demo 21-interop.png           interop

          # La pantalla adaptativa, en las dos condiciones que la justifican.
          demo 18-adaptativo-normal.png adaptativo
          xcrun simctl ui "$SIMULADOR" content_size accessibility-extra-extra-extra-large
          demo 19-adaptativo-grande.png adaptativo
          xcrun simctl ui "$SIMULADOR" content_size medium

      - name: Que quedo
        working-directory: PatitasiOS
        run: ls -la capturas

      - name: Publicar las capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-libro
          path: PatitasiOS/capturas/*.png
          if-no-files-found: error
