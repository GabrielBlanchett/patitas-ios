# Workflow temporal: no compila nada, solo le pregunta al runner qué tiene.
#
# Existe porque el libro no puede citar una version de Xcode ni un nombre de
# simulador que nadie haya comprobado. Primero se pregunta, despues se fija el
# valor real en ci-macos.yml, y este archivo se borra.

name: Reconocimiento del runner

on: workflow_dispatch

jobs:
  entorno:
    runs-on: macos-26
    steps:
      - name: Version del sistema
        run: sw_vers

      - name: Arquitectura
        run: uname -m

      - name: Xcode instalados
        run: ls /Applications | grep -i xcode || echo "ninguno en /Applications"

      - name: Xcode seleccionado
        run: xcodebuild -version

      - name: Version de Swift
        run: swift --version

      - name: SDK disponibles
        run: xcodebuild -showsdks

      - name: Simuladores disponibles
        run: xcrun simctl list devices available

      - name: XcodeGen ya instalado?
        run: which xcodegen || echo "no instalado; habra que traerlo con brew"

      - name: Herramientas de apoyo
        run: |
          brew --version
          git --version
